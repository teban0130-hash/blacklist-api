AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Entrega 3 - CI/CD de la API de lista negra: CodePipeline toma cada commit de
  la rama principal en GitHub, CodeBuild ejecuta las pruebas unitarias y crea la
  imagen de contenedor (ECR), y CodeDeploy la despliega en ECS Fargate (blue/green).
  Requiere el stack fargate-stack.yaml ya creado.
  Despues de crear el stack, la conexion con GitHub queda en estado PENDING y
  hay que autorizarla una vez en la consola (Developer Tools > Connections).

Parameters:
  ProjectName:
    Type: String
    Default: blacklist-api-ci
    Description: Prefijo de los recursos (proyecto de CodeBuild, pipeline, roles).
    AllowedPattern: "[a-z0-9-]{3,24}"
  GitHubRepository:
    Type: String
    Default: teban0130-hash/blacklist-api
    Description: Repositorio de GitHub en formato propietario/nombre.
  BranchName:
    Type: String
    Default: main
    Description: Rama que dispara el pipeline en cada commit.
  EcrRepositoryName:
    Type: String
    Default: blacklist-api
    Description: Repositorio ECR creado por fargate-stack.yaml.
  DBHost:
    Type: String
    Description: Endpoint del RDS (output DatabaseEndpoint de blacklist-stack).
  DBSecretArn:
    Type: String
    Description: ARN del secreto de la base de datos (output DBSecretArn de blacklist-stack).
  AuthSecretArn:
    Type: String
    Description: ARN del secreto del token (output AuthSecretArn de fargate-stack).
  CodeDeployApplicationName:
    Type: String
    Default: blacklist-api-cd
  DeploymentGroupName:
    Type: String
    Default: blacklist-api-dg
  TaskExecutionRoleArn:
    Type: String
    Description: Output TaskExecutionRoleArn de fargate-stack.
  TaskRoleArn:
    Type: String
    Description: Output TaskRoleArn de fargate-stack.

Resources:
  # ---------------- Bucket de artefactos ----------------
  # Guarda los artefactos internos de CodePipeline y la copia builds/app-<commit>.zip
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ---------------- Conexion con GitHub ----------------
  # Se crea en estado PENDING; se autoriza a mano en la consola una sola vez
  GitHubConnection:
    Type: AWS::CodeConnections::Connection
    Properties:
      ConnectionName: !Sub "${ProjectName}-github"
      ProviderType: GitHub

  # ---------------- CodeBuild ----------------
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${ProjectName}"
      RetentionInDays: 14

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Logs del build en CloudWatch
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${BuildLogGroup.Arn}:*"
              # Leer el codigo que entrega CodePipeline y escribir el artefacto
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              # Login y push de la imagen a ECR
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}"
              # Reportes de pruebas y cobertura (seccion reports del buildspec)
              - Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                  - codebuild:BatchPutCodeCoverages
                Resource: !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/${ProjectName}-*"

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref ProjectName
      Description: Pruebas unitarias y construccion de la imagen de la API de lista negra
      ServiceRole: !GetAtt CodeBuildRole.Arn
      # El codigo y la salida los maneja CodePipeline; los pasos estan en buildspec.yml
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        # Necesario para ejecutar docker build dentro de CodeBuild
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: ECR_REPOSITORY_URI
            Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}"
          - Name: DB_HOST
            Value: !Ref DBHost
          - Name: DB_SECRET_ARN
            Value: !Ref DBSecretArn
          - Name: AUTH_SECRET_ARN
            Value: !Ref AuthSecretArn
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      TimeoutInMinutes: 15

  # ---------------- CodePipeline ----------------
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-pipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Guardar y leer los artefactos entre etapas
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
              # Descargar el codigo de GitHub a traves de la conexion
              - Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnection
              # Lanzar el build y consultar su estado
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt BuildProject.Arn
              # Despliegue blue/green en ECS con CodeDeploy
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeServices
                  - ecs:UpdateService
                  - ecs:TagResource
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref TaskExecutionRoleArn
                  - !Ref TaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref ProjectName
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      # Se ejecuta automaticamente con cada push (commit) a la rama principal
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: GitHub
            Push:
              - Branches:
                  Includes:
                    - !Ref BranchName
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: TestAndPackage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: Deploy
          Actions:
            - Name: DeployToFargate
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              Configuration:
                ApplicationName: !Ref CodeDeployApplicationName
                DeploymentGroupName: !Ref DeploymentGroupName
                TaskDefinitionTemplateArtifact: BuildOutput
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: BuildOutput
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: BuildOutput
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: BuildOutput

Outputs:
  ArtifactBucketName:
    Description: Bucket con los artefactos internos de CodePipeline
    Value: !Ref ArtifactBucket
  GitHubConnectionArn:
    Description: Conexion con GitHub (autorizarla en la consola si esta en PENDING)
    Value: !Ref GitHubConnection
  CodeBuildProjectName:
    Description: Proyecto de CodeBuild
    Value: !Ref BuildProject
  PipelineName:
    Description: Pipeline de CodePipeline
    Value: !Ref Pipeline
  PipelineConsoleURL:
    Description: Enlace al pipeline en la consola de AWS
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"
